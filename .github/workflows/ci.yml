name: CI

on:
  push:
    branches: [main]
  pull_request:
    # Include the Phase 11 dependency branch so stacked follow-up PRs receive exact-head CI.
    branches: [main, phase/11-landed-cost-weight-allocation, phase/11-transit-final-unit-cost, security/w0-2b-r2-enforcement]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m venv backend/.venv
      - run: backend/.venv/bin/python -m pip install -r requirements.txt
      - run: scripts/verify_backend.sh

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      # Do not let a green build conceal high/critical dependency advisories.
      # Keep npm's full advisory output in the job log so the exact package,
      # dependency path, affected range, and available fix can be reviewed.
      - name: Block high and critical npm vulnerabilities
        run: npm audit --audit-level=high
        working-directory: frontend
      - run: scripts/verify_frontend.sh

  postgresql:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.11
        env:
          POSTGRES_DB: erp_afghanistan
          POSTGRES_USER: erp_afghanistan
          POSTGRES_PASSWORD: erp_afghanistan
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U erp_afghanistan -d erp_afghanistan"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DJANGO_SETTINGS_MODULE: config.settings.postgres
      POSTGRES_DB: erp_afghanistan
      POSTGRES_USER: erp_afghanistan
      POSTGRES_PASSWORD: erp_afghanistan
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m venv backend/.venv
      - run: backend/.venv/bin/python -m pip install -r requirements.txt
      - name: Provision matching PostgreSQL 17 client tools
        shell: bash
        run: |
          set -euo pipefail
          # Ubuntu's default repository may ship a different major version.
          # Use the official PGDG repository and independently check its key.
          # https://www.postgresql.org/download/linux/ubuntu/
          . /etc/os-release
          test "$ID" = ubuntu
          key=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl --fail --silent --show-error --location \
            --retry 3 -o "$key" https://www.postgresql.org/media/keys/ACCC4CF8.asc
          fingerprint="$(gpg --batch --show-keys --with-colons "$key" | awk -F: '$1=="fpr" {print $10; exit}')"
          test "$fingerprint" = B97B0AFCAA1A47F044F244A07FCC7D46ACCC4CF8
          printf 'deb [signed-by=%s] https://apt.postgresql.org/pub/repos/apt %s-pgdg main\n' \
            "$key" "$VERSION_CODENAME" | sudo tee /etc/apt/sources.list.d/hesabdari-pgdg.list
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql-client-17
          bin=/usr/lib/postgresql/17/bin
          for tool in pg_dump pg_restore createdb dropdb; do
            "$bin/$tool" --version | tee /tmp/"$tool"-version
            grep -Eq 'PostgreSQL\) 17\.' /tmp/"$tool"-version
          done
          echo "$bin" >> "$GITHUB_PATH"
      - run: scripts/verify_postgresql.sh


  windows-key-custody-evaluation:
    name: Windows key custody evaluation (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: [windows-2022, windows-2025, windows-11-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Identify Windows runner and process identity
        run: |
          python -c "import getpass, platform, sys; print(platform.platform()); print('Python:', sys.version); print('Process user:', getpass.getuser())"
          whoami /user
      # cryptography >=46.0.4 no longer publishes win_arm64 wheels.
      # Provide native ARM64 OpenSSL for its source build, without changing runtime constraints.
      - name: Provision native ARM64 OpenSSL for source build
        if: matrix.runner == 'windows-11-arm'
        shell: pwsh
        run: |
          python -c "import platform; assert platform.machine().lower() == 'arm64', platform.machine()"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $root = Join-Path $env:RUNNER_TEMP "vcpkg-arm64"
          git clone --depth 1 --branch 2026.10.16 https://github.com/microsoft/vcpkg.git $root
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & (Join-Path $root "bootstrap-vcpkg.bat") -disableMetrics
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & (Join-Path $root "vcpkg.exe") install openssl:arm64-windows-static-md --host-triplet arm64-windows --classic
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "VCPKG_ROOT=$root" >> $env:GITHUB_ENV
          "VCPKGRS_TRIPLET=arm64-windows-static-md" >> $env:GITHUB_ENV
          & (Join-Path $root "vcpkg.exe") list
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Install isolated evaluation dependency
        run: python -m pip install --disable-pip-version-check "pytest>=8.0,<9.0" "cryptography>=44,<47"
      - name: Verify installed cryptography backend
        run: python -c "import platform, cryptography; from cryptography.hazmat.backends.openssl.backend import backend; print(platform.machine(), cryptography.__version__, backend.openssl_version_text())"
      - name: Probe DPAPI CurrentUser and Credential Manager
        shell: pwsh
        working-directory: backend
        run: |
          $config = Join-Path $env:RUNNER_TEMP "pytest-windows.ini"
          Set-Content -Path $config -Value "[pytest]" -Encoding ascii
          python -m pytest -c $config -q security/test_windows_key_custody_eval.py security/test_windows_key_provider.py security/test_windows_session_probe.py
  tauri:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Tauri system libraries (GTK/WebKit)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev \
            libjavascriptcoregtk-4.1-dev libsoup-3.0-dev \
            libgtk-3-dev build-essential \
            curl wget file libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build frontend bundle (Tauri embeds ../dist)
        run: npm ci && npm run build
        working-directory: frontend
      - name: Install Rust toolchain
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: frontend/src-tauri
      - name: cargo check (Tauri shell compiles)
        working-directory: frontend/src-tauri
        run: |
          set +e
          cargo check > /tmp/cargo_check.log 2>&1
          status=$?
          if [ "$status" -ne 0 ]; then
            # Surface the compiler error through a workflow annotation so it
            # stays readable even when raw log archives are unavailable.
            python3 -c 'import pathlib,sys; t=pathlib.Path("/tmp/cargo_check.log").read_text(errors="replace")[-3500:]; sys.stdout.write("::error title=cargo-check-details::"+t.replace("%","%25").replace("\r","").replace("\n","%0A")+"\n")'
            echo "cargo check exited with status $status" >&2
            exit "$status"
          fi
